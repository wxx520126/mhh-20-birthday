name: Deploy birthday page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          for dir in */; do
            name="${dir%/}"

            case "$name" in
              .git|.github|site)
                continue
                ;;
            esac

            if [ -f "$dir/index.html" ]; then
              cp -R "$dir" "site/$name"
            fi
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site