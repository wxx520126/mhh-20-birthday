<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="theme-color" content="#121212" />
  <title>男朋友的专属画廊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121212;
      --bg-2: #1a1a1f;
      --bg-3: #090909;
      --text: #f7efe3;
      --muted: rgba(247, 239, 227, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.48);
      --front: #f6f1ea;
      --paper: #ecd9b6;
      --paper-deep: #dcc18d;
      --paper-text: #4f3923;
      --accent: #ffd8a0;
      --accent-strong: #ffb16f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: "Noto Serif SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 191, 102, 0.12), transparent 20%),
        radial-gradient(circle at 80% 0%, rgba(132, 163, 255, 0.1), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.04), transparent 20%),
        linear-gradient(180deg, var(--bg-2), var(--bg) 28%, var(--bg-3));
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.16) 0 1px, transparent 1.6px),
        radial-gradient(circle at 65% 12%, rgba(255, 227, 188, 0.16) 0 1px, transparent 1.6px),
        radial-gradient(circle at 82% 38%, rgba(255, 255, 255, 0.12) 0 1px, transparent 1.6px),
        radial-gradient(circle at 33% 68%, rgba(255, 255, 255, 0.08) 0 1px, transparent 1.6px),
        radial-gradient(circle at 88% 78%, rgba(255, 236, 210, 0.1) 0 1px, transparent 1.6px);
      background-size: 260px 260px, 320px 320px, 300px 300px, 380px 380px, 340px 340px;
      opacity: 0.55;
    }

    body::after {
      background: linear-gradient(180deg, rgba(18, 18, 18, 0.12), rgba(18, 18, 18, 0.8));
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 780px);
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
    }

    .hero {
      position: relative;
      padding: 42px 0 18px;
    }

    .hero::after {
      content: "";
      display: block;
      width: 68px;
      height: 1px;
      margin-top: 18px;
      background: linear-gradient(90deg, transparent, rgba(255, 216, 160, 0.65), transparent);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.82rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 231, 194, 0.78);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: 0.02em;
      font-weight: 800;
      color: #fff6ea;
      text-wrap: balance;
    }

    .hero-subtitle {
      margin: 14px 0 0;
      font-size: clamp(0.98rem, 3.6vw, 1.08rem);
      line-height: 1.8;
      color: var(--muted);
    }

    .hero-subtitle strong {
      color: var(--accent);
      font-family: "Caveat", "Noto Serif SC", cursive;
      font-size: 1.22em;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .music-toggle {
      position: absolute;
      top: 6px;
      right: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 56px;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: #fff5ea;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease;
    }

    .music-toggle:active {
      transform: scale(0.97);
    }

    .music-toggle:focus-visible {
      outline: 2px solid rgba(255, 216, 160, 0.9);
      outline-offset: 3px;
    }

    .music-icon {
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
    }

    .music-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
      display: block;
    }

    .music-toggle[data-playing="true"] .icon-play {
      display: none;
    }

    .music-toggle[data-playing="false"] .icon-pause {
      display: none;
    }

    .music-note {
      display: none;
    }

    .tip {
      margin: 14px 0 8px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      color: rgba(247, 239, 227, 0.84);
      background: rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      line-height: 1.7;
      font-size: 0.96rem;
    }

    .gallery {
      display: grid;
      gap: 22px;
      padding-top: 16px;
    }

    .flip-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5.35;
      border: 0;
      padding: 0;
      background: transparent;
      perspective: 1600px;
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      -webkit-appearance: none;
      appearance: none;
    }

    .flip-card:focus-visible {
      outline: 2px solid rgba(255, 216, 160, 0.85);
      outline-offset: 6px;
      border-radius: 28px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.92s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }

    .flip-card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 26px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow);
    }

    .card-front {
      padding: 14px 14px 46px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(243, 238, 230, 0.98)),
        var(--front);
    }

    .photo-frame {
      position: relative;
      height: 100%;
      min-height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #0f0f12;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .photo-frame::after {
      content: "轻触翻面";
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-family: "Caveat", cursive;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: rgba(255, 247, 234, 0.92);
      background: rgba(18, 18, 18, 0.36);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .photo-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.02) contrast(1.04) brightness(1.01);
      transform: scale(1.01);
    }

    .card-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 18px 20px;
      color: var(--paper-text);
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.42), transparent 22%),
        radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.18), transparent 20%),
        linear-gradient(180deg, #f3e3c3 0%, #ead1a0 100%);
    }

    .card-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.16), transparent 26%, rgba(120, 92, 49, 0.03) 48%, transparent 72%, rgba(255, 255, 255, 0.12)),
        repeating-linear-gradient(0deg, rgba(111, 82, 42, 0.028) 0 2px, transparent 2px 6px);
      opacity: 0.7;
      pointer-events: none;
    }

    .card-back > * {
      position: relative;
      z-index: 1;
    }

    /* 已移除 .back-label 视觉元素（按要求隐藏馆长短评的标签与外框） */

    .back-text {
      margin: 8px 0 0;
      font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: clamp(1.08rem, 4vw, 1.32rem);
      line-height: 1.9;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .back-signature {
      margin-top: 14px;
      text-align: right;
      font-family: "Caveat", cursive;
      font-size: 1.15rem;
      color: rgba(79, 57, 35, 0.82);
      letter-spacing: 0.06em;
    }

    .card-sticker {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.75);
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, #ffb57f, #d87c41);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      font-family: "Caveat", cursive;
      font-size: 0.92rem;
      line-height: 1;
      text-align: center;
    }

    .card-sticker small {
      display: block;
      font-size: 0.82rem;
      opacity: 0.95;
    }

    .footer-space {
      height: 8px;
    }

    .closing-note {
      margin-top: 10px;
      padding: 18px 18px 20px;
      border: 1px solid rgba(255, 232, 196, 0.14);
      border-radius: 22px;
      background:
        radial-gradient(circle at top left, rgba(255, 246, 227, 0.13), transparent 38%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.03));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 16px 30px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .closing-note__label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      color: rgba(255, 224, 177, 0.9);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 224, 177, 0.16);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .closing-note__text {
      margin: 0;
      color: rgba(247, 239, 227, 0.88);
      font-size: 0.98rem;
      line-height: 1.9;
      letter-spacing: 0.02em;
    }

    .closing-note__signature {
      margin-top: 12px;
      text-align: right;
      font-family: "Caveat", cursive;
      font-size: 1.18rem;
      color: rgba(255, 216, 160, 0.9);
      letter-spacing: 0.06em;
    }

    @media (min-width: 680px) {
      .app {
        padding-inline: 18px;
      }

      .gallery {
        gap: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-inner,
      .music-toggle {
        transition: none;
      }

      .music-icon svg {
        animation: none !important;
      }
    }

    @keyframes pulseBar {
      0%, 100% {
        transform: scaleY(0.68);
        opacity: 0.62;
      }
      50% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .music-toggle[data-playing="true"] .icon-pause rect {
      animation: pulseBar 1.1s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .music-toggle[data-playing="true"] .icon-pause rect:nth-child(1) {
      animation-delay: 0s;
    }

    .music-toggle[data-playing="true"] .icon-pause rect:nth-child(2) {
      animation-delay: 0.12s;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="播放背景音乐" data-playing="false">
        <span class="music-icon" aria-hidden="true">
          <svg class="icon icon-play" viewBox="0 0 24 24" role="presentation" aria-hidden="true">
            <path d="M8 5.5v13a1 1 0 0 0 1.51.86l10.8-6.5a1 1 0 0 0 0-1.72l-10.8-6.5A1 1 0 0 0 8 5.5Z"></path>
          </svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" role="presentation" aria-hidden="true">
            <rect x="6" y="5.5" width="4" height="13" rx="1.2"></rect>
            <rect x="14" y="5.5" width="4" height="13" rx="1.2"></rect>
          </svg>
        </span>
        <span class="music-note">音乐</span>
      </button>

      <p class="eyebrow">男朋友的专属画廊</p>
      <h1 id="galleryTitle">《宝宝晗 · 绝美特展》</h1>
      <p class="hero-subtitle">Curated by <strong>潇潇</strong> <br><span>亲爱的宝宝晗，当你感到容貌焦虑时，来看看潇潇记录的美丽的你吧</span></p>
    </header>


    <section class="gallery" id="gallery" aria-label="照片展览"></section>
    <section class="closing-note" aria-label="结语">
      <div class="closing-note__label">结语</div>
      <p class="closing-note__text">亲爱的晗，你不用为自己的一点小瑕疵而烦恼焦虑，这些记录下来的美丽瞬间，就像星星一样熠熠生辉，一点点的暗淡是不会遮盖星星的光芒的！你永远是最美丽的！</p>
      <div class="closing-note__signature">From your curator</div>
    </section>
    <div class="footer-space" aria-hidden="true"></div>
  </main>

  <audio id="backgroundMusic" preload="auto" loop playsinline autoplay>
    <source src="./music/M500004VR0Hn3bkqqE.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const heroConfig = {
      babeName: "毛晗晗",
      curatorName: "潇潇"
    };

    const galleryData = [
      {
        image: "./images/1.jpg",
        text: "哈喽亲爱的宝宝晗<br>我想这是你最喜欢的照片，所以我把他放在第一张<br>18岁的你，充满了爱与希望，美的像一幅油画<br>"
      },
      {
        image: "./images/2.jpg",
        text: "看到这个可爱新年晗晗的人，都会交上好运哦"
      },
      {
        image: "./images/3.jpg",
        text: "这张照片非常非常有气质，就像女王一样华丽动人"
      },
      {
        image: "./images/4.jpg",
        text: "这个是准备拍写真的小晗晗，眼睛大大的好可爱哈哈哈哈"
      },

      {
        image: "./images/7.jpg",
        text: "仙女下凡！小小的北宁公园有大大的美女"
      },
      {
        image: "./images/8.jpg",
        text: "偷偷给潇潇一个大惊喜的晗，彻底抓住了潇的心哦"
      },
      {
        image: "./images/9.jpg",
        text: "这个和小狗狗合照的小晗晗真的超级可爱，照片里有两个小宝宝"
      },
      {
        image: "./images/10.jpg",
        text: "哈哈哈哈这个可能跟我在制作生日礼物时候的晗差不多，嘟起小嘴看书哈哈哈哈"
      },
      {
        image: "./images/11.jpg",
        text: "潇潇的头像，这张美丽的侧脸，眼睛里有星星哦"
      },
      {
        image: "./images/12.jpg",
        text: "这身衣服真的很适合你哦，有一种温柔淑雅的感觉"
      },
      {
        image: "./images/13.jpg",
        text: "那段时间的晗晗心情有一点down down的，但是在烟台和恬恬的假期真的很治愈，一段难忘的回忆"
      },
      {
        image: "./images/14.jpg",
        text: "来提升实验室平均颜值啦"
      },
      {
        image: "./images/15.jpg",
        text: "三分靠潇潇拍，七分靠晗晗p图，剩下九十分全凭女朋友长得美呀"
      }
    ];

    const gallery = document.getElementById("gallery");
    const title = document.getElementById("galleryTitle");
    const musicToggle = document.getElementById("musicToggle");
    const backgroundMusic = document.getElementById("backgroundMusic");

    title.textContent = `《${heroConfig.babeName}的照片馆》`;
    document.title = `${heroConfig.babeName}的照片馆`;
    document.querySelector(".hero-subtitle strong").textContent = heroConfig.curatorName;

    function createCard(item, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "flip-card";
      card.setAttribute("aria-pressed", "false");
      card.setAttribute("aria-label", `第 ${index + 1} 张照片，点击翻转查看馆长短评`);

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="photo-frame">
              <img src="${item.image}" alt="第 ${index + 1} 张照片" loading="lazy" decoding="async" />
            </div>
            <div class="card-sticker" aria-hidden="true">
              <small>TAP</small>
              FLIP
            </div>
          </div>
          <div class="card-face card-back">
            <div>
              <p class="back-text">${item.text}</p>
            </div>
            <div class="back-signature">From your curator</div>
          </div>
        </div>
      `;

      card.addEventListener("click", () => {
        const flipped = card.classList.toggle("is-flipped");
        card.setAttribute("aria-pressed", String(flipped));
      });

      return card;
    }

    function renderGallery() {
      const fragment = document.createDocumentFragment();
      galleryData.forEach((item, index) => {
        fragment.appendChild(createCard(item, index));
      });
      gallery.appendChild(fragment);
    }

    async function startMusic() {
      if (!backgroundMusic) {
        return;
      }

      try {
        backgroundMusic.currentTime = backgroundMusic.currentTime || 0;
        await backgroundMusic.play();
      } catch (error) {
        console.warn("音乐播放失败", error);
        return;
      }

      musicToggle.dataset.playing = "true";
      musicToggle.setAttribute("aria-pressed", "true");
      musicToggle.setAttribute("aria-label", "暂停背景音乐");
    }

    async function tryAutoplayMusic() {
      if (!backgroundMusic) {
        return;
      }

      try {
        await startMusic();
      } catch (error) {
        console.warn("自动播放被浏览器拦截", error);
        musicToggle.dataset.playing = "false";
        musicToggle.setAttribute("aria-pressed", "false");
        musicToggle.setAttribute("aria-label", "播放背景音乐");
      }
    }

    function stopMusic() {
      if (!backgroundMusic) {
        return;
      }

      backgroundMusic.pause();

      musicToggle.dataset.playing = "false";
      musicToggle.setAttribute("aria-pressed", "false");
      musicToggle.setAttribute("aria-label", "播放背景音乐");
    }

    musicToggle.addEventListener("click", async () => {
      if (musicToggle.dataset.playing === "true") {
        stopMusic();
        return;
      }

      try {
        await startMusic();
      } catch (error) {
        console.warn("音乐启动失败", error);
      }
    });

    renderGallery();
    tryAutoplayMusic();
  </script>
</body>
</html>
